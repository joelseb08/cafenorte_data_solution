[project]
name = "cafenorte-data-solution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel Sebastian Salinas Barrera", email = "sebastian808.pue@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adbc-driver-manager>=1.12.0",
    "fastexcel>=0.21.0",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
cafenorte-data-solution = "cafenorte_data_solution:main"
demo = "cafenorte_data_solution.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
